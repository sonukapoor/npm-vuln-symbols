name: extract

# Proposes new symbol records from newly published advisories.
#
# This never writes to the dataset directly. It opens a pull request against
# proposals/, which a human promotes into advisories/ after review. Extraction
# runs at roughly 75 percent precision, so unreviewed output must not be
# treated as data.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Download the OSV npm advisory feed
        run: |
          curl -sS -o npm-all.zip \
            https://storage.googleapis.com/osv-vulnerabilities/npm/all.zip
          mkdir -p osv-feed
          unzip -q -o npm-all.zip -d osv-feed

      # Extract into a scratch directory, never over the tracked one. Writing
      # into proposals/ and then trying to reconcile it against git is what
      # produced a pull request deleting all 565 records.
      - name: Propose symbol records
        run: |
          set -euo pipefail
          npx tsx scripts/extract.ts --osv-dir osv-feed --out _new-proposals | tee extract.log
          echo "ADVISORIES_READ=$(grep -oE '[0-9]+' <<< "$(grep 'advisories read' extract.log)")" >> "$GITHUB_ENV"
          echo "SYMBOLS_PROPOSED=$(grep -oE '[0-9]+' <<< "$(grep 'symbols proposed' extract.log)")" >> "$GITHUB_ENV"

      - name: Keep only records that are genuinely new
        run: |
          set -euo pipefail
          added=0
          for f in _new-proposals/*.json; do
            if [ ! -e "$f" ]; then continue; fi
            name=$(basename "$f")
            # Already reviewed and promoted, so it is settled.
            if [ -e "advisories/$name" ]; then continue; fi
            # Already sitting in the review queue.
            if [ -e "proposals/$name" ]; then continue; fi
            cp "$f" "proposals/$name"
            added=$((added + 1))
          done
          echo "new records: $added"
          echo "NEW_RECORDS=$added" >> "$GITHUB_ENV"

      - name: Clean up the feed before committing
        run: rm -rf osv-feed npm-all.zip _new-proposals extract.log

      - name: Open a pull request
        if: env.NEW_RECORDS != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: extract/proposals
          title: "Proposed symbol records from new advisories"
          commit-message: "Add proposed symbol records from new advisories"
          add-paths: proposals/**
          body: |
            Machine-proposed records from the OSV npm feed.

            Measured at roughly 75 percent precision on a held-out sample, so
            every entry needs review before it is promoted into `advisories/`.

            For each file, check that the named symbols really are the
            vulnerable exports, then move it to `advisories/` and set
            `reviewedBy` and `reviewedAt`.

      # A run that finds nothing looks identical to a run that is broken: both
      # are a green tick with no pull request. This states which one happened,
      # on the run page, without anyone reading the logs.
      - name: Report what happened
        if: always()
        run: |
          {
            echo "## Nightly extraction"
            echo
            echo "| | |"
            echo "|---|---:|"
            echo "| Advisories read | ${ADVISORIES_READ:-unknown} |"
            echo "| Symbols proposed | ${SYMBOLS_PROPOSED:-unknown} |"
            echo "| Already in the dataset | $(( ${SYMBOLS_PROPOSED:-0} - ${NEW_RECORDS:-0} )) |"
            echo "| **New records** | **${NEW_RECORDS:-0}** |"
            echo
            if [ "${NEW_RECORDS:-0}" -eq 0 ]; then
              echo "No pull request opened, because nothing new was found."
              echo
              echo "This is the expected result most days. About 97 percent of the npm"
              echo "feed is malicious-package reports, which are deliberately ignored,"
              echo "and only around 8 percent of the remainder name an extractable"
              echo "symbol. Expect a pull request every week or two, not every morning."
            else
              echo "Opened a pull request with ${NEW_RECORDS} new record(s) for review."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
